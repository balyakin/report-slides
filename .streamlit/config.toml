[server]
address = "127.0.0.1"
port = 8504
headless = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "Arial, -apple-system, Segoe UI, sans-serif"
headingFont = "Arial, -apple-system, Segoe UI, sans-serif"
codeFont = "Arial, -apple-system, Segoe UI, sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["2.125rem", "1.375rem", "1.25rem", "1.125rem", "1rem", "1rem"]
headingFontWeights = 600
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
borderColor = "#E2E8F0"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeHeaderTextColor = "#475569"
grayColor = "#475569"
grayTextColor = "#475569"
grayBackgroundColor = "#F1F5F9"
blueColor = "#2563EB"
blueTextColor = "#1D4ED8"
blueBackgroundColor = "#EFF6FF"
greenColor = "#166534"
greenTextColor = "#166534"
greenBackgroundColor = "#F0FDF4"
redColor = "#B91C1C"
redTextColor = "#991B1B"
redBackgroundColor = "#FEF2F2"
orangeColor = "#92400E"
orangeTextColor = "#92400E"
orangeBackgroundColor = "#FFFBEB"
